schema_version: 1
workspace_root: ../..

# New Super Mario Bros. Wii. Every value below was read from a real dump by
# example-wii-nx/scripts/extract-dol + inspect-dol; README.md shows how.
project:
  id: nsmbwii-smne01
  display_name: New Super Mario Bros. Wii
  game_id: SMNE01             # NTSC-U, Rev 2
  region: E

memory:
  base: 0x80000000
  size: 0x01800000
  sda_base: 0x8042F680        # _SDA_BASE_  (r13), set in the startup code
  sda2_base: 0x80433080       # _SDA2_BASE_ (r2),  set in the startup code

inputs:
  dol:
    path: Assets/nsmbwii/main.dol
    # sha256: pin your dump once it translates cleanly

translation:
  entry_points:
    - 0x80004050              # the DOL header's entry point
  # function_map:
  #   path: projects/nsmbwii/MAP.txt
  # First pass: no unsupported instructions allowed, so gaps surface immediately.
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  # Where this game keeps the functions the runtime replaces, found by matching
  # their code (example-wii-nx/scripts/resolve-symbols).
  native_bindings: projects/nsmbwii/bindings.json
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: build/nsmbwii
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: base/nsmbwii_base_manifest.json
